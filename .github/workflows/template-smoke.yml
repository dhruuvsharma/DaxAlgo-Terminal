# Proves the `dotnet new daxalgo-sandbox-{strategy,visualizer}` templates scaffold a project that
# BUILDS and TESTS against the DaxAlgo.Sdk sandbox contract. Two jobs:
#
#  * in-repo   — packs the SDK chain from THIS checkout into a local feed, checks both templates pin
#                the current SDK version, then installs + scaffolds + builds + tests each template
#                against that feed. Every push/PR — needs no published package.
#  * published — installs DaxAlgo.Templates from NuGet.org and scaffolds against the PUBLISHED
#                packages with no repo checkout (pure NuGet resolution). Gated behind schedule +
#                manual dispatch so a version-bump PR doesn't fail here before the version is live.
name: template-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — catch a broken published chain
  workflow_dispatch:

jobs:
  # ── Anti-drift: each in-repo template must scaffold + build + test against a locally-packed SDK ──
  in-repo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Templates pin the current SDK version
        shell: pwsh
        run: |
          # A fresh scaffold must reference the exact SDK version built from this checkout. The
          # scheduled published job independently proves the external NuGet chain.
          $ver = (Select-String -Path Directory.Build.props -Pattern '<DaxAlgoSdkVersion>([^<]+)</DaxAlgoSdkVersion>').Matches[0].Groups[1].Value
          foreach ($tmpl in 'daxalgo-sandbox-strategy', 'daxalgo-sandbox-visualizer') {
            $props = "templates/content/$tmpl/Directory.Build.props"
            $pin = (Select-String -Path $props -Pattern '<DaxAlgoSdkVersion>([^<]+)</DaxAlgoSdkVersion>').Matches[0].Groups[1].Value
            if ($pin -ne $ver) { throw "$tmpl pins DaxAlgoSdkVersion $pin != repo $ver. Bump the template's Directory.Build.props." }
            Write-Host "$tmpl pins $ver (matches DaxAlgoSdkVersion)."
          }

      - name: Pack the vNext SDK chain into a local feed
        shell: pwsh
        run: |
          $feed = "$env:RUNNER_TEMP/sdk-feed"
          $projects = @(
            'src/windows/Core/TradingTerminal.Core/TradingTerminal.Core.csproj',
            'src/windows/UI/TradingTerminal.UI.Core/TradingTerminal.UI.Core.csproj',
            'src/windows/Shell/TradingTerminal.UI/TradingTerminal.UI.csproj',
            'src/windows/Sdk/DaxAlgo.Sdk/DaxAlgo.Sdk.csproj',
            'src/windows/Sdk/DaxAlgo.Sdk.Wpf/DaxAlgo.Sdk.Wpf.csproj'
          )
          foreach ($p in $projects) { dotnet pack $p -c Release -o $feed; if ($LASTEXITCODE -ne 0) { throw "local package failed: $p" } }
          dotnet nuget add source $feed --name daxalgo-ci-local
          if ($LASTEXITCODE -ne 0) { throw 'local package source registration failed' }

      - name: Install both templates from source
        shell: pwsh
        run: |
          dotnet new install ./templates/content/daxalgo-sandbox-strategy --force
          if ($LASTEXITCODE -ne 0) { throw 'strategy template install failed' }
          dotnet new install ./templates/content/daxalgo-sandbox-visualizer --force
          if ($LASTEXITCODE -ne 0) { throw 'visualizer template install failed' }

      - name: Scaffold + build + test both templates
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/scaffold"
          New-Item -ItemType Directory -Force $work | Out-Null
          foreach ($t in @(
            @{ short = 'daxalgo-sandbox-strategy';   name = 'SmokeStrategy' },
            @{ short = 'daxalgo-sandbox-visualizer'; name = 'SmokeVisualizer' })) {
            $out = Join-Path $work $t.name
            & dotnet new $t.short -n $t.name -o $out; if ($LASTEXITCODE -ne 0) { throw "scaffold failed: $($t.short)" }
            $sln = Get-ChildItem -Recurse $out -Filter '*.slnx' | Select-Object -First 1
            if (-not $sln) { throw "no .slnx scaffolded: $($t.short)" }
            dotnet build $sln.FullName -c Release; if ($LASTEXITCODE -ne 0) { throw "build failed: $($t.short)" }
            dotnet test  $sln.FullName -c Release --no-build; if ($LASTEXITCODE -ne 0) { throw "test failed: $($t.short)" }
            Write-Host "$($t.short): scaffolded, built, tested."
          }

  # ── Published: scaffold from NuGet.org with no repo checkout (pure package resolution) ──────────
  published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install DaxAlgo.Templates from NuGet.org
        shell: pwsh
        run: dotnet new install DaxAlgo.Templates --force

      - name: Scaffold + build + test against the published packages
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/scaffold"
          New-Item -ItemType Directory -Force $work | Out-Null
          foreach ($t in @(
            @{ short = 'daxalgo-sandbox-strategy';   name = 'SmokeStrategy' },
            @{ short = 'daxalgo-sandbox-visualizer'; name = 'SmokeVisualizer' })) {
            $out = Join-Path $work $t.name
            & dotnet new $t.short -n $t.name -o $out; if ($LASTEXITCODE -ne 0) { throw "scaffold failed: $($t.short)" }
            $sln = Get-ChildItem -Recurse $out -Filter '*.slnx' | Select-Object -First 1
            dotnet build $sln.FullName -c Release; if ($LASTEXITCODE -ne 0) { throw "build failed: $($t.short)" }
            dotnet test  $sln.FullName -c Release --no-build; if ($LASTEXITCODE -ne 0) { throw "test failed: $($t.short)" }
            Write-Host "$($t.short): built + tested against published packages."
          }
