name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Opt JS-based actions into Node 24 now (silences the Node 20 deprecation warnings).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore TradingTerminal.Windows.slnx

      - name: Build
        run: dotnet build TradingTerminal.Windows.slnx -c Release --no-restore

      # Postgres-backed tests self-skip without Docker; [WpfFact] tests run on the windows runner.
      #
      # -m:1 is REQUIRED, not a tuning knob. `dotnet test <solution>` runs one MSBuild invocation per
      # project IN PARALLEL, and several suites contend for machine-wide singletons — the execution
      # account mutex and the native VM handle. Without it CI is flaky by construction, and a red run
      # tells you nothing about the change that triggered it.
      - name: Test
        run: dotnet test TradingTerminal.Windows.slnx -c Release --no-build --verbosity normal -m:1
