# Local data services for DaxAlgo Terminal. Everything here is free / open-source.
#
#   docker compose up -d        # start (after Docker Desktop is running)
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and wipe the data volume
#
# ── Docker is OPTIONAL, and for most people unnecessary ───────────────────────────────────────────
#
# Installed builds bundle the QuestDB runtime and start it themselves — no Docker, no container.
# This file exists for a SOURCE checkout, where the runtime is not staged until you run
# scripts/stage-questdb.ps1. Either approach works; running this compose file is the alternative to
# staging, not an addition to it.
#
# A source tree with neither runs with **persistence off** — logged loudly at startup, never silent.
#
# ── What was removed (2026-08-23) ─────────────────────────────────────────────────────────────────
#
# This file also defined a `timescaledb` service until 2026-08-26. Nothing could use it: the
# Postgres/TimescaleDB store provider was removed on 2026-08-23 along with the single-file SQLite
# one, because nothing selected either. `MarketDataProvider` now has exactly two values — QuestDb
# (the default) and SqlitePerBroker (embedded, no container). A compose service for a backend the
# application cannot address is a trap for whoever reads this next.
services:
  # QuestDB = Apache-2 time-series database, and the default store provider. It owns EVERY stream —
  # quotes, trades, depth and bars — with bars deduplicated on (ts, instrument, bar_size), because a
  # forming bar is re-sent until it closes. Writes use ILP over HTTP (9000); the app reads and
  # creates schema over the PostgreSQL wire protocol (8812).
  #
  # There is no silent fallback. If this is down, persistence is disabled and said so — the app does
  # not quietly degrade to SQLite behind your back.
  questdb:
    image: questdb/questdb:latest          # pin to e.g. :8.2.1 for reproducibility
    container_name: daxalgo-questdb
    environment:
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: quest
    ports:
      - "9000:9000"    # HTTP: ILP-over-HTTP ingest + REST + web console
      - "8812:8812"    # PostgreSQL wire protocol (SQL reads + DDL)
      - "9009:9009"    # ILP over TCP (unused by the app, exposed for tooling)
    volumes:
      - daxalgo-questdb:/var/lib/questdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  daxalgo-questdb:
